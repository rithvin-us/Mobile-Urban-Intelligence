name: Bug report
description: Something in the platform does not behave as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If the issue has a security impact, please follow
        [SECURITY.md](../blob/main/SECURITY.md) instead of filing it publicly.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where does the problem show up?
      options:
        - Backend API (apps/api)
        - Operator dashboard (apps/web)
        - Edge AI pipeline (edge)
        - Fleet simulator (simulator)
        - MATLAB / Simulink models (matlab sims)
        - Deployment / Docker
        - Documentation
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up -d postgres redis
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste the shortest excerpt that shows the failure. This is rendered as code, so no backticks needed.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:              Ubuntu 22.04
        Python:          3.12.15
        Node / pnpm:     20.11 / 8.15
        Docker:          27.0
        MATLAB:          R2026b (if relevant)
    validations:
      required: true
