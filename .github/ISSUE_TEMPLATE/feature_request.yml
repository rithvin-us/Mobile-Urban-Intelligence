name: Feature request
description: Propose a capability the platform does not have yet.
labels: ["enhancement", "triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend API (apps/api)
        - Operator dashboard (apps/web)
        - Edge AI pipeline (edge)
        - Fleet simulator (simulator)
        - MATLAB / Simulink models (matlab sims)
        - Deployment / Docker
        - Documentation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can a municipal operator not do today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: What you would build, and roughly how it fits the existing architecture.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.
