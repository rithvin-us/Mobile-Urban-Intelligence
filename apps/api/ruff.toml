# Pinning the rule set keeps CI deterministic: without this, a new ruff
# release can widen the defaults and fail a build that changed nothing.
line-length = 120
target-version = "py310"

[lint]
# Import sorting is left off on purpose: tests set DATABASE_URL before
# importing the app, and reordering those lines would break the fixture.
select = ["E4", "E7", "E9", "F"]
